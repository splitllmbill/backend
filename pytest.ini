[pytest]
# Only collect the real suite. Keeps a bare `pytest` (CI) from sweeping up the
# manual root-level test_api.py integration script and the vendored wheels'
# test modules under catalyst/appsail/build/.
testpaths = tests
# Put the repo root on sys.path so `from app...` imports resolve under a
# bare `pytest` invocation (CI), not just `python -m pytest` (local).
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
